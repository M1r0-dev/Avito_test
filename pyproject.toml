[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-candidate-retrieval"
version = "0.1.0"
description = "Hybrid candidate generation for Avito service search"
requires-python = ">=3.10"
dependencies = [
  "catboost>=1.2",
  "faiss-cpu>=1.8",
  "matplotlib>=3.8",
  "nbformat>=5.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sentence-transformers>=3.0",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4", "pytest>=8", "ruff>=0.6"]
# Online path / latency benchmark only (ONNX export and ONNX Runtime encoder);
# not needed to reproduce answer.csv.
latency = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1", "threadpoolctl>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
